services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: agent_memory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_memory"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - agent_memory_pgdata:/var/lib/postgresql/data

volumes:
  agent_memory_pgdata:
