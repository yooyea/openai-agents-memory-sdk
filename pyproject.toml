[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "openai-agents-memory"
version = "0.1.0"
description = "A lightweight long-term memory extension for the OpenAI Agents SDK."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "yooyea" }]
dependencies = [
  "openai-agents[sqlalchemy]>=0.18.3,<0.19",
  "openai>=1.99.0",
  "pydantic>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "asyncpg>=0.30,<1",
  "pgvector>=0.4,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/openai_agents_memory"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
